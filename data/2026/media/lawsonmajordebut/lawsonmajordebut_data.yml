    text: |-
      ＼7月15日号インタビュー／
      6月10日にシングル「FLiCK」でメジャーデビューを果たしたNEK!。
      「画面越しじゃわからないこともあるから、会いに来てほしいんです」
      自らの道を進む新曲「FLiCK」、9月の東名阪ワンマンツアー、初の全国ツアーを経たライブへの思いを語りました。
      @nekiband_jp
    translation: |-
      ＼July 15 Issue Interview／
      NEK!, who made their major debut on June 10 with the single "FLiCK."
      "There are things you can't understand through a screen, so I want you to come see us."
      They shared their thoughts on their path-forging new song "FLiCK," the September one-man tour in Tokyo, Nagoya, and Osaka, and performing live after their first nationwide tour.
      @nekiband_jp
