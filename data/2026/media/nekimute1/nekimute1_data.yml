                  - text: For the release of the EP "B!NARY", NEK! has its own radio show !!!!<br>This is the first show of a 2-shows serie.
                - line:
                  - text: The first block starts with a self-description of the band and its member. Then, they speak about "B!NARY", their major debut EP.
                - line:
                  - text: In the second block, Natsu and Kanade participate to the "MUTE NEK!" corner. Natsu describes her passion for Shojo Mangas, and Kanade expresses her love for Pretty Cure!
