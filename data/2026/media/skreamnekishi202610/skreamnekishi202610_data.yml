                lines:
                - line:
                  - text: 'In the fifth installment of the column, Kanade reflects on her journey as a musician: from a childhood surrounded by music, to picking up the bass, and eventually joining NEK!.'
                - line:
                  - text: She then outlines the band's recent milestones, including their national tour, major debut, and the release of their EP, "B!NARY".
                - line:
                  - text: The column concludes with insights into the EP's production process and a brief tease regarding unannounced future tracks.
