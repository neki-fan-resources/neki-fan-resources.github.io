      【HARAJUKU STREET SNAP】
      
      Hikaさん
      @46_hikaa 
      ——————
      ワンピースをパンツに重ねる自由な発想が光る、気負わないレイヤードスタイル。淡いブルーのシャツにドット柄ワンピース、その下にはワイドなトラックパンツ。ガーリーな重ね着を、スポーツウェアでストリートへ引き寄せた。
      ——————
      Zipper SNAPは不定期開催中。
      
      興味があるコは #ZipperSNAP で
      自分のコーデを投稿してね。
      
      #原宿ファッション #FashionSNAP
    translation: |-
