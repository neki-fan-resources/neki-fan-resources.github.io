    label: Thank you
    published-date: 2026-08-19
    text: |-
      RADIO BERRY ベリテンライブ 2026
      @ HEAVEN'S ROCK宇都宮VJ-2
      
      あつかったー！
      初のベリテンありがとうございました！！
      いつも来てくれる人も、初めて出会ってくれた人もみんなありがとう！！
      
      ベリテンTシャツ可愛でしょ、こういう変な生き物好きなんだよね👁💙
      
      次はツアーで会おーね‼️ჱ̒^ ̳  ̫  ̳^
    translation: |-
      RADIO BERRY Berryten Live 2026
      @ HEAVEN'S ROCK Utsunomiya VJ-2
      
      It was so hot!
      Thank you so much for our first Berryten!!
      Thanks to everyone who always comes, and everyone who met us for the first time!!
      
      The Berryten T-shirt is cute, right? I love weird creatures like this👁💙
      
      Let's meet next on the tour‼️ჱ̒^ ̳  ̫  ̳^
