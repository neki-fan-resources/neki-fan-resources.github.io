- postx:
    id: 2090063198896734447
    account: coco_102
    label: Thank you
    published-date: 2026-08-19
    text: |-
      ベリテンライブ2026ありがとうございました！！
      宇都宮でライブができて嬉しかったです！！
      フロアのみんなとても熱くて最高でした🤟🏻
      ライブ終わりにみんなで餃子も食べたよ〜！
      見事に胃袋掴まれたのでまたライブしに来ます😂🥟
      
      次のライブは東名阪ツアーです！まずは大阪！
      張り切っていきまっせ🔥
    translation: |-
      Thank you so much for Berryten Live 2026!!
      I was so happy we got to play a live show in Utsunomiya!!
      Everyone on the floor was super energetic and amazing🤟🏻
      We all ate gyoza together after the show too~!
      They totally captured our stomachs, so we'll definitely come back to play another show😂🥟
      
      Our next show is the Tokyo-Nagoya-Osaka tour! First up is Osaka!
      Let's give it all we've got🔥
