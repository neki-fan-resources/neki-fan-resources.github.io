      Berryten!
      Thank you very much!
      It was so much fun!!
      First time in Tochigi! First Berryten! Made the best memories!
      We'll do our best so we can definitely come back again💪🏻❤️‍🔥
      
      Next up is finally the Tokyo-Nagoya-Osaka tour!!
      Only a few tickets left for Osaka!! Can't wait🤟🏻
