    id: 2090055267027390526
    account: natsu08_guitar
    label: Thank you
    published-date: 2026-08-19
    text: |-
      ベリテンー！
      ありがとうございました！
      めっちゃ楽しかったです！！
      初栃木！初ベリテン！最高の思い出が作れました！
      また必ず戻って来られるよう頑張ります💪🏻❤️‍🔥
      
