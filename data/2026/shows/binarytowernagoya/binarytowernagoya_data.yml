- postx:
    id: 2096472750173151372
    account: coco_102
    label: Thank you
    published-date: 2026-09-06
    text: |-
      タワーレコード名古屋パルコ店インストアイベント
      愛知初のアコースティックミニライブ！
      観に来てくださり本当にありがとうございました🙂‍↕️💛
      サイン会では、カホンに興味を持ってくれた方がたくさんいるとわかってとても嬉しくなりました！
      これからもB!NARYをよろしくお願いします！
    translation: |-
      Tower Records Nagoya Parco in-store event
      Our first acoustic mini live in Aichi!
      Thank you so very much for coming to watch🙂‍↕️💛
      During the autograph session, I was so happy to find out that a lot of people were interested in the cajón!
      Please continue to give your love and support to B!NARY!
    image:
    - HRgq2Dfa4AADdII
