- postx:
    id: 2096462847215820887
    account: cure_bass_baka
    label: Thank you
    published-date: 2026-09-06
    text: |-
      Major 1st EP「B!NARY」
      発売記念インストアイベント
      @ タワーレコード名古屋パルコ店
      
      初の名古屋インストありがとー！！
      東京だけでなく名阪とインストできて幸せ者でした。
      リリイベ次は9/13渋谷タワレコさんで！
      ツアーはファイナル9/23です🥹
      まだまだ楽しんでこうね、ありがとう！！
    translation: |-
      Major 1st EP "B!NARY"
      Release Commemorative In-Store Event
      @ Tower Records Nagoya Parco
      
      Thank you so much for our first Nagoya in-store!!
      I felt so lucky to be able to do in-stores not just in Tokyo, but in Nagoya and Osaka too.
      Next release event is on 9/13 at Shibuya Tower Records!
      The tour final is on 9/23🥹
      Let's keep having fun, thank you so much!!
    image:
    - HRgh2CXaIAAXD28
    - HRgh2CYboAA0iu3
    part-of:
      show:
        year: 2026
        id: binarytowernagoya

