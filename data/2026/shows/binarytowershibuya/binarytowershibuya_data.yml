    translation: |-
      Tower Records Shibuya in-store event
      Thank you so much🫶🏻
      
      I was so happy to talk with everyone so much again today!
      I'm so sad the release events are coming to an end🥲
      I want to bring you the sound of my cajón again somewhere! Definitely!
      
      For now today, I'm going to pamper my cajón that worked hard with me across Tokyo, Nagoya, and Osaka! Thank you!
