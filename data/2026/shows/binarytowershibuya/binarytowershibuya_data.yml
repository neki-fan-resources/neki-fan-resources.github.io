- postx:
    id: 2099113010413650366
    account: 46_hikaa
    label: Thank you
    published-date: 2026-09-13
    text: |-
      メジャー1st EP『B!NARY』発売記念
      インストアイベント
      最後はタワーレコード渋谷店様でした！
      
      今日まで各地で、私たちの音楽と声を届けられたこと、そしてみんなの言葉を直接
      聞けたことが本当に嬉しかったです。
      
      この時間を力にここから
      もっと大きく前へ！
      
      みんな！いつもありがとう！
    translation: |-
      Major 1st EP "B!NARY" Release Commemoration
      In-Store Event
      The finale was at Tower Records Shibuya!
      
      I was so truly happy that up until today across every city, we were able to deliver our music and voices, and directly
      hear everyone's words.
      
      Turning this time into strength, from here on
      stepping even bigger and further forward!
      
      Everyone! Thank you always!
    image:
    - HSGMJ9jaIAABFeM
    part-of:
      show:
        year: 2026
        id: binarytowershibuya

- postx:
    id: 2099115624782000547
    account: natsu08_guitar
    label: Thank you
    published-date: 2026-09-13
    text: |-
      リリイベ東京編！
      ありがとうございましたー！
      たくさんの方が会いにきてくださって、とっても嬉しかったですっ♡
      EPやツアーの感想をたくさん聞けて本当に濃い時間が過ごせました❤️‍🔥
      これにてリリイベ東名阪全て終了！寂しい、、、
      残すはツアーファイナル！！最高の思い出つくろうねー！
    translation: |-
      Release event Tokyo edition!
      Thank you so much!
      So many people came to see us, and I was super happy♡
      Getting to hear so many thoughts on the EP and the tour made it such a truly rich time❤️‍🔥
      And with that, the release events across Tokyo, Nagoya, and Osaka have all ended! So lonely...
      All that's left is the tour final!! Let's make the best memories together!
    image:
    - HSGOh-XasAEoojz
    part-of:
      show:
        year: 2026
        id: binarytowershibuya

