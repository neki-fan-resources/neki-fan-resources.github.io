- postx:
    id: 2099072289958756383
    account: cure_bass_baka
    label: Thank you
    published-date: 2026-09-13
    text: |-
      Major 1st EP「B!NARY」
      発売記念インストアイベント
      @タワーレコード渋谷店
      
      今日もたくさんの方とお話できて本当に楽しかったし私にとって癒しの時間でした！！
      みんなからもらった幸せで、23日さらに倍にして幸せ返します‼️ჱ̒^ ̳  ̫  ̳^
      
      リリイベ東名阪これにて終了！
      来てくれたみんなありがと！
    translation: |-
      Major 1st EP "B!NARY"
      Release Commemoration In-Store Event
      @ Tower Records Shibuya
      
      It was so much fun getting to talk with so many people again today, and it was truly such a comforting time for me!!
      With the happiness everyone gave me, I'll double it and return all that happiness to you on the 23rd‼️ჱ̒^ ̳  ̫  ̳^
      
      And with that, our release events across Tokyo, Nagoya, and Osaka have come to an end!
      Thank you to everyone who came out!
    image:
    - HSFnHKea4AAkJvr
    - HSFnHKebsAA7EBe
    part-of:
      show:
        year: 2026
        id: binarytowershibuya

