- postx:
    id: 2095471724221677628
    account: coco_102
    label: Thank you
    published-date: 2026-09-03
    text: |-
      タワーレコードNU茶屋町店インストアイベント
      ありがとうございました！！💛
      
      アコースティック編成はいかがだったでしょうか？
      久々に皆の前でカホンが叩けて嬉しかったし、サイン会では皆さんとたくさんお話ができて楽しかったです！
      
      B!NARYをこれからもよろしくお願いします🙂‍↕️🙏🏻
    translation: |-
      Tower Records NU Chayamachi Store in-store event
      Thank you so much!!💛
      
      How did you like the acoustic arrangement?
      I was happy to be able to play the cajón in front of everyone after so long, and I had lots of fun getting to talk with you all so much at the autograph session!
      
      Please continue to support B!NARY going forward🙂‍↕️🙏🏻
    image:
    - HRScZp0aoAAW7w-
    - HRScZqDboAEv8md
    part-of:
      show:
        year: 2026
        id: binarytowerumeda

- postx:
    id: 2095472890074542384
    account: cure_bass_baka
    label: Thank you
    published-date: 2026-09-03
    text: |-
      Major 1st EP「B!NARY」
      発売記念インストアイベント
      @ タワーレコード梅田NU茶屋町店
      
      初の大阪インストありがとうございました！
      やっとライブ以外で来れて嬉しかった！！
      平日だったからみんな色々忙しい中駆けつけてくれて本当にありがとう🥹
      明日のツアー初日もよろしくだ！！
    translation: |-
      Major 1st EP "B!NARY"
      Release Commemorative In-Store Event
      @ Tower Records Umeda NU Chayamachi Store
      
      Thank you so much for our first Osaka in-store event!
      I was so happy to finally come here for something other than a live show!!
      It was a weekday, so thank you all so much for rushing over despite being so busy with everything🥹
      Let's make tomorrow's tour first day amazing too!!
