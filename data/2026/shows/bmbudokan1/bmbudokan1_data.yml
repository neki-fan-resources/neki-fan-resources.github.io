    label: Thank you
    published-date: 2026-11-13
    text: |-
      BAND-MAID WORLD TOUR 2026 FINAL
      オープニングアクト務めさせていただきました！！
      早めに来て私たちのライブを観てくださった皆様本当にありがとうございました！
      皆さんの暖かい声援や拍手に心がポカポカしました🥲
      
      明日も気合い入れて頑張ります！！
      
      photo by MASANORI FUJIKAWA
    translation: |-
      BAND-MAID WORLD TOUR 2026 FINAL
      We had the honor of serving as the opening act!!
      Thank you so much to everyone who arrived early to watch our live performance!
      Everyone's warm cheers and applause made my heart feel all warm and fuzzy 🥲
      
      Tomorrow too, I'll stay fired up and give it my all!!
      
      photo by MASANORI FUJIKAWA
