- postx:
    id: 2107469121223066083
    account: 46_hikaa
    label: Thank you
    published-date: 2026-10-06
    text: |-
      「Ignition!!! 〜Acoustic Two Man Show〜」
      @ 下北沢440
      
      本日はこたにさんとのツーマン！
      ありがとうございます！！
      
      4年ぶりの弾き語りライブ。
      
      緊張したけど、やっぱ一人の空間も好きだ自分の声とギターの音が鳴るステージで
      また、弾き語りしたいなぁ。
    translation: |-
      "Ignition!!! 〜Acoustic Two Man Show〜"
      @ Shimokitazawa 440
      
      Today was a two-man live with Kotani-san!
      Thank you so much!!
      
      My first acoustic live in 4 years.
      
      I was nervous, but I really love being in a space on my own too, on a stage where my own voice and guitar resonate
      I'd love to do an acoustic live again.
