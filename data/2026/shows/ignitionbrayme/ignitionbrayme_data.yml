    label: Thank you
    published-date: 2026-08-17
    text: |-
      251 presents Ignition!!! 
      〜Special Two Man Show〜
      お越しくださった皆さんありがとうございました！！
      今年もめっちゃ楽しかったです！ソールドしたギッチギチのフロアと作り上げるライブはまじで気持ち良すぎた！！
      これからも姉さんたちのかっこいい背中追っかけてがむしゃらに頑張ります👊🏻🔥
    translation: |-
      251 presents Ignition!!! 
      〜Special Two Man Show〜
      Thank you so much to everyone who came!!
      It was so much fun again this year! Creating a live show together with a sold-out, packed-tight floor felt truly amazing!!
      I'll keep chasing after the cool backs of our big sisters and doing my absolute best👊🏻🔥
