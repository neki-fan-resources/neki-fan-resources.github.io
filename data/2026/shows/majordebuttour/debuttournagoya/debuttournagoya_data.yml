- postx:
    id: 2096212406787883057
    account: cure_bass_baka
    label: Thank you
    published-date: 2026-09-05
    text: |-
      “NEK! MAJOR DEBUT TOUR”
      @ 愛知・RAD SEVEN
      
      ツアー2日目名古屋ありがとーーー！！！
      ソールドもありがとだよ！！
      みんなの熱気が今日もすごくて負けないように頑張りました👊🏻
      今回も幸せとどれられたかなーー。
      
      また明日インストで会える人はそこで！
      ツアーは次ファイナルでお会いしましょっ！！
    translation: |-
      “NEK! MAJOR DEBUT TOUR”
      @ Aichi・RAD SEVEN
      
      Thank you so muuuch for tour day 2 Nagoyaーーー!!!
      Thank you for the sold-out show too!!
      Everyone's heat was amazing today too, so I worked hard not to be outdone👊🏻
      I wonder if I was able to deliver happiness this time tooーー.
      
      For those I can see tomorrow at the in-store, see you there!
      As for the tour, let's meet next at the final!!
