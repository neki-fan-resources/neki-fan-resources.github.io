- postx:
    id: 2096211901680349459
    account: natsu08_guitar
    label: Thank you
    published-date: 2026-09-05
    text: |-
      東名阪ツアー！　
      2日目愛知！
      ありがとうございました！！
      みんなの声にたっくさんパワーをもらったよぉぉ！楽しすぎたっっ！
      アッチアチの空間をありがとう！❤️‍🔥❤️‍🔥
      また愛知に戻ってこられるよう頑張ります💪🏻
      では！ファイナルの東京でお待ちしております！（明日はインストアイベントもあります！）
    translation: |-
      Tomeihan tour! 
      Day 2, Aichi!
      Thank you so much!!
      Everyone's voices gave me soooo much power! It was way too much fun!!
      Thank you for the super blazing-hot space!❤️‍🔥❤️‍🔥
      We'll do our best so we can return to Aichi again💪🏻
      Well then! We'll be waiting for you at the tour final in Tokyo! (There's also an in-store event tomorrow!)
