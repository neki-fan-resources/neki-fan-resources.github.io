- postx:
    id: 2096209645975298443
    account: coco_102
    label: Thank you
    published-date: 2026-09-05
    text: |-
      東名阪ツアー愛知公演ありがとうございました！🩵
      めちゃめちゃアツくて、最高に楽しかったです！
      MCでお立ち台に立ったときに後ろまで皆の顔がよく見えて、こんなにたくさんの方がライブを楽しんでくれているんだ！と嬉しくなりました☺️
      東名阪ツアー残すは東京！気合い入れていきます！！
    translation: |-
      Thank you so much for the Tomeihan tour Aichi show!🩵
      It was crazy hot, and insanely fun!
      When I stood on the riser during the MC, I could see everyone's faces clearly all the way to the back, and it made me so happy to see so many people enjoying our live show!☺️
      All that's left of the Tomeihan tour is Tokyo! We're gonna give it our all!!
    image:
    - HRc7jYaacAARPhy
    - HRc7jYcakAAyeiV
    - HRc7jYfaAAADZst
    - HRc7jYmb0AAm3rd
    part-of:
