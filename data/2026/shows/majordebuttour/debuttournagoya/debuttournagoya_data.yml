        year: 2026
        id: debuttournagoya

- postx:
    id: 2096210047873548567
    account: 46_hikaa
    label: Thank you
    published-date: 2026-09-05
    text: |-
      “NEK! MAJOR DEBUT TOUR”
      
      東名阪ツアー2日目
      愛知もソールドアウトありがとう。
      
      私たちが何があってもぜってぇーに！
      ライブでみんなを笑顔にさせて帰るから
      また、大阪と愛知、この場所に戻ってくる
      
      明日はインストアイベント
      よろしくお願いします！
    translation: |-
      “NEK! MAJOR DEBUT TOUR”
      
      Day 2 of the Tomeihan tour
      Thank you for selling out Aichi too.
      
      No matter what happens, we absolutely, definitely will!
      make everyone leave the live show with a smile, so
      we will return to this place, to Osaka and Aichi again
      
      Tomorrow is the in-store event
      Looking forward to seeing you!
