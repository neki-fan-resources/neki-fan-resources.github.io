- postx:
    id: 2095877890147778582
    account: cure_bass_baka
    label: Thank you
    published-date: 2026-09-04
    text: |-
      “NEK! MAJOR DEBUT TOUR“
      @ 大阪・BANGBOO
      
      ツアー初日ありがとうございました！
      改めてソールドもありがとう🥹
      私なりに幸せな空間が作れるように全力尽くしました！
      初披露だったEPの新曲ちゃん達どうだったかな！
      楽しんでもらえてら嬉しい！！
      明日の名古屋もよろしくだ！
    translation: |-
      “NEK! MAJOR DEBUT TOUR“
      @ Osaka・BANGBOO
      
      Thank you so much for the tour's first day!
      Thank you again for the sold-out show🥹
      I gave it my all to create a happy space in my own way!
      How did you like the new songs from the EP that we performed for the first time!
      I hope you enjoyed them!!
      Looking forward to tomorrow in Nagoya too!
    image:
    - HRYN1E8bgAAt7BV
    - HRYN1EzboAAsoLq
    part-of:
      show:
        year: 2026
        id: debuttourosaka

- postx:
    id: 2095880167759716624
    account: natsu08_guitar
    label: Thank you
    published-date: 2026-09-04
    text: |-
      ツアー初日大阪！🐙
      ありがとうございました！
      初日からソールドアウトできて最高のスタートを切れました！！
      最初から最後までみんなの笑顔が輝いていてとっっても幸せな時間でした…！😌💛
      新曲も初出しSEもいかがでしたか…！
      愛知、東京も楽しもうねー！！
    translation: |-
      Tour first day, Osaka!🐙
      Thank you so much!
      Being able to sell out from day one made for the best possible start!!
      Everyone's smiles were shining from start to finish, making it such a deeply happy time...!😌💛
      How did you like the new songs and the first-ever reveal of the intro SE...!?
      Let's have a blast in Aichi and Tokyo too!!
    image:
    - HRYP4aMbYAAGZYc
    - HRYP4aOb0AAC5QI
