- postx:
    id: 2095876327522128149
    account: coco_102
    label: Thank you
    published-date: 2026-09-04
    text: |-
      東名阪ツアー初日大阪ありがとうございました！！
      EP曲はもちろん、ライブ定番曲もたくさん詰め込んで、ほぼノンストップで駆け抜けて非常にハイカロリーなライブでした🥵🔥
      フロアもアツすぎたー！本当にありがとう！！
      今日より何倍も成長した姿でまた大阪戻ってきます！
      明日は愛知公演！！
    translation: |-
      Thank you so much for the first day of the Tomeihan tour in Osaka!!
      Packed with EP songs of course, along with plenty of live staples, running through nearly non-stop made for an extremely high-energy show🥵🔥
      The floor was crazy hot too! Thank you all so much!!
      We'll come back to Osaka again, having grown many times stronger than today!
      Tomorrow is the Aichi show!!
    image:
    - HRYMZ-YbEAAF2vT
    - HRYMZ-ma0AEpXIP
    part-of:
      show:
        year: 2026
        id: debuttourosaka

