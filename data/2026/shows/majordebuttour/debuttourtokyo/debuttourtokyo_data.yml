    id: 2102734679212539933
    account: coco_102
    label: Thank you
    published-date: 2026-09-23
    text: |-
      ツアーファイナルありがとうございました！！
      皆さんのお陰で最高の締めくくりになりました！！
      素敵な笑顔と歓声にパワーたくさんもらったよ🔥
      皆さんも私達からのパワー受け取ってくれましたか？
      これからも運命共同体としてよろしくお願いします🤝🏻
      
      NEK!の旅はまだまだ続く！！
    translation: |-
      Thank you so much for the tour final!!
      Thanks to everyone, it was the best possible conclusion!!
      I received so much power from your wonderful smiles and cheers🔥
      Did everyone receive the power from us too?
      Please continue to support us as companions bound by shared destiny🤝🏻
      
      NEK!'s journey is far from over!!
