- postinstagram:
    id: DebUAxymrs4
    account: cocoro_drum
    label: Cocoro's report
    published-date: 2026-10-13
    text: |-
      2026.09.23
      ⁡
      "NEK! MAJOR DEBUT TOUR" ツアーファイナル、東京！
      duo MUSIC EXCHANGEにお越しくださった皆様本当にありがとうございました！！
      ⁡
      メジャーデビューを記念して回ってきた今回のツアー。
      皆さんに支えられながら無事東名阪完走できました！！
      しかも全日程ソールドアウト💥本当にありがとうございます！
      各会場でフロアを見渡すとずっと応援してくれているファンの皆さんの中に、初めてお目にかかる方もたくさんいて、NEK!の輪がだんだん広まっているのを今回のツアーでも実感できてとても嬉しかったです！
      
      メジャーデビュー後初のEP「B!NARY」を引っさげて東名阪回ってきましたが、初日の大阪の時点で初披露だった新曲たちも初めてとは思えないくらいフロアのノリ方が既に仕上がっていて、もうその時点でツアーファイナルはどうなるんだろうと楽しみになっていました！
      
      そして迎えたツアーファイナル！
      1曲目のFLiCKからフロアの熱量はMAX🔥
      みんなは私たちの音圧に負けないように声を出してくれて、私たちはみんなの熱量に応えるようにパフォーマンスするという見事な相乗効果でどんどん会場の熱気は高まり、数曲やっただけでもうラストスパートですか？というくらいの汗だく状態😂(みんなもそうだったよね？笑)
      
      結成してから皆さんと一緒に育ててきたライブ定番曲たちと今回リリースした新曲たち、新旧ごちゃまぜにしたパワフルなセットリストで最後まで駆け抜け、NEK!らしさ全開のライブを全力でお届けしました！
      
      ギューギューなフロアで最初から最後まで全力で声出してジャンプして拳を突き上げて私たちにエールを送ってくれた皆さんに本当に感謝です！！皆さんのおかげで最高のツアーファイナルになりました！本当にありがとう！！
      ライブ中、私たちが皆さんからたくさんパワーをもらえたように、私たちも皆さんにパワーを届けられていたら嬉しいです🌞
      
      そして来年の1月から再び新たな旅がスタートします！
      今回はどんな景色が見れるんだろう！初めて行く土地もいくつかあるし、結成日も日程に入ってるので、色々と特別な全国ツアーになる予感、、！！
      私たちと一緒に新たな最高の思い出をつくりましょう！
      ⁡
      
      photo by @ryuji_kinmruj 
      
      #neki #neki_band #girlsband #drum #femaledrummer
    translation: |-
      2026.09.23
      ⁡
      "NEK! MAJOR DEBUT TOUR" Tour Final, Tokyo!
      To everyone who came to duo MUSIC EXCHANGE, thank you so very much!!
      ⁡
      This tour was held in celebration of our major debut.
      With everyone's support, we successfully completed the Tokyo-Nagoya-Osaka tour!!
      On top of that, every single date was SOLD OUT💥 Thank you so much!
      Looking across the floor at each venue, among the fans who have been supporting us all along, there were so many people seeing us for the first time, and it made me so happy to truly feel that the circle of NEK! is steadily expanding through this tour too!
      
      Carrying our first post-major-debut EP "B!NARY," we toured Tokyo, Nagoya, and Osaka; even on the first day in Osaka, the floor's energy for the new songs being performed for the first time was already so dialed in that it was hard to believe it was their debut, and right from that moment I was already excited wondering what the tour final would be like!
      
      And then came the tour final!
      Right from the first song, FLiCK, the floor's heat level was at MAX🔥
      Everyone gave their voices so as not to be overwhelmed by our sound pressure, and we performed to answer everyone's heat—through that wonderful synergy, the venue's passion kept rising, and after just a few songs, I was drenched in sweat to the point of thinking, "Is this already the final stretch?"😂 (You guys were too, right? lol)
      
      With a powerful setlist blending the old and the new—combining the live staples we've nurtured together with everyone since forming the band, along with the newly released songs—we charged all the way through to the end and delivered a live performance packed with NEK!'s spirit at full power!
      
      To everyone who cheered us on by shouting, jumping, and raising your fists with all your might from beginning to end on the packed floor, thank you so very much!! Thanks to everyone, it became the best tour final! Thank you so much!!
      Just as we received so much power from everyone during the live show, I hope we were able to deliver power to all of you too🌞
      
      And starting next January, a new journey begins once again!
      I wonder what kind of scenery we'll get to see this time! There are several places we'll be visiting for the first time, and our band's formation anniversary is also included in the schedule, so I have a feeling it's going to be a very special nationwide tour in many ways...!!
      Let's make new, incredible memories together with us!
      ⁡
      
      photo by @ryuji_kinmruj 
      
      #neki #neki_band #girlsband #drum #femaledrummer
