- postx:
    id: 2102735785569231309
    account: 46_hikaa
    label: Thank you
    published-date: 2026-09-23
    text: |-
      〝NEK! MAJOR DEBUT TOUR〟
      
      東名阪ツアー、全公演ソールドアウト。
      本当にありがとうございます。
      
      最初のMCで言った、
      お互いありのままの姿を曝け出すステージにしたい。
      
      そう思って始まったツアーファイナル
      最後まで最高の時間でした。
      
      一緒にこの時間を作ってくれて、
      本当にありがとう。
    translation: |-
      “NEK! MAJOR DEBUT TOUR”
      
      Tokyo-Nagoya-Osaka tour, all shows sold out.
      Thank you so very much.
      
      Like I said during the first MC,
      I wanted to make this a stage where we expose our true selves to each other.
      
      That's the feeling the tour final started with,
      and it was the best time right up to the end.
      
      For creating this time together with us,
      thank you so much.
    image:
    - HS5rDKdbMAAxHnd
    part-of:
      show:
        year: 2026
        id: debuttourtokyo

