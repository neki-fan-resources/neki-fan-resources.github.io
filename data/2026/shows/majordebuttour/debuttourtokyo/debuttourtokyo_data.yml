      Seeing everyone's joyful faces made it truly such an incredibly happy day!
      Thank you so very much for coming along with us this far!
      We made the best memories across Tokyo, Nagoya, and Osaka!
      
      A nationwide tour has also been decided.
      Please continue to support NEK! from here on!! Love you all!
