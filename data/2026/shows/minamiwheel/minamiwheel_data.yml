- postx:
    id: 2108839172593299659
    account: coco_102
    label: Thank you
    published-date: 2026-10-10
    text: |-
      ミナホ今年もありがとうございました👊🏻💜
      開演前からの入場規制めっちゃ嬉しかったです！！
      ギューギューのフロアのおかげで最高に熱いライブができました！NEK!のライブもっと楽しみたいよ！という方はぜひ来年のツアーも遊びに来てください🙌🏻
      
      またライブハウスで会いましょう！！
    translation: |-
      Thank you again for Minaho this year👊🏻💜
      I was so happy we hit admission restrictions even before the show started!!
      Thanks to the jam-packed floor, we had the hottest, best live show! To anyone thinking "I want to enjoy NEK!'s live shows even more!", please come visit us on our tour next year too🙌🏻
      
      Let's meet at the live house again!!
    image:
    - HUQaC9vaMAA-oZD
