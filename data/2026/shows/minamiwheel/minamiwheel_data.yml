- postx:
    id: 2108830437825253614
    account: cure_bass_baka
    label: Thank you
    published-date: 2026-10-10
    text: |-
      #FM802 MINAMI WHEEL 2026
      @ VARON
      
      入場規制したー！！来てくれたみんなありがとう🥹
      もう熱気がすごくて、汗だくライブでした！
      前から後ろの方まで手上げて、声出してくれて本当にありがとう！！
      来年もまたミナホでみんなと会えますように！
    translation: |-
      #FM802 MINAMI WHEEL 2026
      @ VARON
      
      We hit admission restrictions!! Thank you to everyone who came🥹
      The heat was just incredible, it was such a sweat-drenched live show!
      Thank you so much to everyone from front to back for raising your hands and cheering!!
      I hope we can meet you all again at Minaho next year!
    image:
    - HUQSGRGaEAEmNeh
    - HUQSGRbagAE_I14
    part-of:
