    text: |-
      ◤￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣
      　     ミナホ 出演者第2弾発表
      　　　　        　  &
      　 💥 257組の日割りが解禁 📣
      ＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿◢
      
      📅10/10(土)〜12(月・祝)で開催の
      
      　　　        #Maxell presents
      ＼🚀FM802 MINAMI WHEEL 2026🌟／
      
      #ミナホ だから楽しめる！
      ジャンルレスな ”いま！ライブを見てほしい！”
      208組のアーティストを新たに解禁🎊
      
      そして、3日間の日割りをどどんと公開！🗓️
      
      お好きなラインナップに合わせて楽しめる
      【 1DAY PASS 】の先行受付もスタート！
      
      毎年売り切れの【 3DAY PASS 】もまだ間に合います🎫💨
      
      詳細はここからチェック✅↓
      https://minamiwheel.jp
