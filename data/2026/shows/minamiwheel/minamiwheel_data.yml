        year: 2026
        id: minamiwheel

- postx:
    id: 2108832631249064378
    account: natsu08_guitar
    label: Thank you
    published-date: 2026-10-10
    text: |-
      3度目のミナミホイール！
      入場規制🈵
      ありがとうございました！！！
      いやぁ〜熱かったー！！！
      前から後ろの方までパンパンで本当に嬉しかったです！
      
      今回観に来てくださった方も観に来られなかった方も1月から始まるツアーの初日が大阪なのでぜひ遊びに来てくださると嬉しいです‼️🐙
    translation: |-
      Our 3rd Minami Wheel!
      Capacity restricted/Full house🈵
      Thank you so much!!!
      Man, it was so hot/intense~!!!
      It was packed from the front all the way to the back, which made me so truly happy!
      
      Whether you came to see us this time or couldn't make it, the first day of our tour starting in January is in Osaka, so we'd love for you to come hang out/see us‼️🐙
    image:
    - HUQUGOQbAAAV_vb
    - HUQUGOYbcAEv3uQ
    part-of:
      show:
        year: 2026
        id: minamiwheel

