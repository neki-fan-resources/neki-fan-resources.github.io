- postx:
    id: 2109650986042359838
    account: coco_102
    label: Thank you
    published-date: 2026-10-12
    text: |-
      「天壌無窮極音道中」ありがとうございました！！
      熱く楽しく激しい、こんな時間が一生続けばいいのになと思う最高の夜でした🔥
      姉さんたちカッコよすぎて鳥肌止まらなかった…
      こんな素敵な対バンライブに呼んでくださったNEMOPHILAさんに心より感謝申し上げます！！
      本当にありがとうございました！
    translation: |-
      Thank you so much for "Tenjou Mukyuu Gokuon Douchuu"!!
      It was the best night—hot, fun, and intense—making me wish moments like this could last forever🔥
      The older sisters were so cool I couldn't stop getting goosebumps…
      From the bottom of my heart, I thank NEMOPHILA for inviting us to such a wonderful joint live show!!
      Thank you so very much!
