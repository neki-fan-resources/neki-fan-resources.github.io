            - interviewsubsection:
                lines:
                - text: 2026.08.12
                - text: 「New Music GROUND vol.2」
                - text: Doona、バチカン市国に愛されたい、DeNeel、NEK!というかなり激アツな対バン！！<br>男性中心のイベントだったのでガールズバンドの底力見せたくて正直かなり気合い入ってました笑
                  translation: A super exciting joint show with Doona, Vatican Shikyoku ni Aisaretai, DeNeel, and NEK!<br>Since it was an event with mostly male bands, I really wanted to show the true power of an all-girl band, so to be honest, I was super fired up (laughs).
                - text: この日は私たちがトリを務めさせていただいたのですが、前3組がフロアの熱気をどんどん高めていったので、私たちがやる頃にはもう完全にサウナ状態で、一曲目から汗だくになりながら盛り上がってくれてて最高でした😂🔥
                  translation: We had the honor of performing as the closing act today. The three bands before us kept building up the heat on the floor, so by the time we played, the room felt completely like a sauna. Seeing everyone get so hyped and sweat with us right from the first song was amazing 😂🔥
                - text: NEK!が今までやってきたライブの中で五本の指に入るくらい暑かったかもしれない笑 全員が全力で楽しんでくれてるのが伝わってきて嬉しかったです！本当にありがとう！！！！
                  translation: Out of all the shows NEK! has played so far, this might be in the top five hottest ones (laughs). I could really feel that everyone was giving their all to have fun, which made me so happy! Thank you all so much!!!!
                - text: DoonaもバチカンもDeNeelもずっと対バンしたいなと思ってたので嬉しかったな〜。どのバンドもそれぞれのキャラを活かしたライブやってて最高にかっこよかったです🙂‍↕️
                  translation: I had wanted to share the stage with Doona, Vatican, and DeNeel for a long time, so I was really glad. Every band put on a show that brought out their unique personality, and they were all so cool 🙂‍↕️
                - text: またどこかで再会できるように頑張ります！！
                  translation: We’ll do our best so we can meet up and share the stage again somewhere!!
