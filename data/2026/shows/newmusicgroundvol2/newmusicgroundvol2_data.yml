- postinstagram:
    id: DciZZe9GseX
    account: cocoro_drum
    label: Cocoro's report
    info: 1st image is reframed
    published-date: 2026-08-27
    text: |-
      2026.08.12
      ⁡
      「New Music GROUND vol.2」
      Doona、バチカン市国に愛されたい、DeNeel、NEK!というかなり激アツな対バン！！
      男性中心のイベントだったのでガールズバンドの底力見せたくて正直かなり気合い入ってました笑
      
      この日は私たちがトリを務めさせていただいたのですが、前3組がフロアの熱気をどんどん高めていったので、私たちがやる頃にはもう完全にサウナ状態で、一曲目から汗だくになりながら盛り上がってくれてて最高でした😂🔥
      
      NEK!が今までやってきたライブの中で五本の指に入るくらい暑かったかもしれない笑 全員が全力で楽しんでくれてるのが伝わってきて嬉しかったです！本当にありがとう！！！！
      
      DoonaもバチカンもDeNeelもずっと対バンしたいなと思ってたので嬉しかったな〜。どのバンドもそれぞれのキャラを活かしたライブやってて最高にかっこよかったです🙂‍↕️
      ⁡
      またどこかで再会できるように頑張ります！！
      ⁡
      
      #neki #neki_band #girlsband #drum #femaledrummer
    translation: |-
      2026.08.12
      ⁡
      "New Music GROUND vol.2"
      An insanely hot joint show with Doona, Vatican Shikyoku ni Aisaretai, DeNeel, and NEK!!
      Since it was a male-centric event, I honestly was super pumped to show the true strength of an all-female band lol
      
      We had the privilege of playing as the closing act that day, and because the 3 bands before us kept driving up the floor's heat, by the time we went on it was completely like a sauna, and seeing everyone get so hyped up while covered in sweat right from the first song was the best😂🔥
      
      It might have been among the top five hottest shows NEK! has ever played lol I was so happy seeing how everyone was enjoying it to the fullest! Thank you so much!!!!
      
      I had always wanted to share the stage with Doona, Vatican, and DeNeel, so I was really glad~. Every band put on a show that played to their own distinct character, and they were all insanely cool🙂‍↕️
      ⁡
      We'll do our best so we can cross paths again somewhere!!
      ⁡
      
      #neki #neki_band #girlsband #drum #femaledrummer
