      show:
        year: 2026
        id: newsignals

- postx:
    id: 2082856054816399780
    account: coco_102
    label: Thank you
    published-date: 2026-07-30
    text: |-
      「-New Signals- 砂月凜々香 × NEK! × Lala」
      
      スペシャルなスリーマン！ありがとうございました🩵
      超満員のフロアめっちゃアツかった〜〜〜！！
      久々に立つSHELTERのステージで色々なことを思い返しながら叩いていたら、なんだか胸が熱くなりました。
      次は今日よりもっとビッグになって帰ってきます👊🏻
    translation: |-
      "-New Signals- Ririka Satsuki × NEK! × Lala"
      
      Thank you so much for a special three-man show!🩵
      The packed floor was so hot~~~!!
      As I was playing on the SHELTER stage for the first time in a while, recalling various memories, I felt a bit moved.
      Next time, we'll come back even bigger than today👊🏻
