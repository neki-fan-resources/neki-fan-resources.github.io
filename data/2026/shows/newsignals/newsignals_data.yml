- postx:
    id: 2082854457214374223
    account: natsu08_guitar
    label: Thank you
    published-date: 2026-07-30
    text: |-
      SHELTERでのスリーマン!
      ありがとうございましたー！！
      1曲目のFLiCKから最高の盛り上がりをありがとう！
      みんなの一体感がすごくてとっても嬉しかったー🥹❤️‍🔥
      Lalaさんも砂月さんもとってもかっこよくて、また対バンできたら嬉しいです！
      次は8/6の横浜ReNY beta！お待ちしております！
    translation: |-
      Three-man show at SHELTER!
      Thank you so much!!
      Thank you for making it an amazing hype right from the first song, FLiCK!
      Everyone's sense of unity was incredible, and I was so happy🥹❤️‍🔥
      Both Lala and Satsuki were super cool, so I'd be really happy if we could share the stage again!
      Next up is Yokohama ReNY beta on 8/6! We'll be waiting for you!
    image:
    - HOfJFGPbAAANit-
    - HOfJFGSbcAEFq4X
