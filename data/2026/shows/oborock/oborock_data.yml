    translation: |-
      ＼🌟 Comment Arrival 🌟／
      
      From #NEK!
      We received a video comment✨
      9/12 (Sat) Tsunuga Stage (Tsuruga Civic Cultural Center) scheduled to perform from 11:25‼️
      
      A girls rock band formed in February 2024🎸
      Their charm lies in powerful, exhilarating tracks and lyrics written in relatable, down-to-earth words✨
      Based in rock and characterized by striking, internet-born lyrics, they are affectionately called the "Slang Rock Band"💖
      Keep your eyes on the momentum of NEK!, who are set to carry the future rock scene!
      
      🌊 Oborock 2026
