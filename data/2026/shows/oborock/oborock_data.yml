- postx:
    id: 2098646606052757557
    account: coco_102
    label: Thank you
    published-date: 2026-09-12
    text: |-
      おぼろっく2026ありがとうございました👊🏻🩵
      ホールに響く打音めちゃくちゃ気持ちよかったー！！
      朝から多くの方に観ていただけて嬉しかったです！
      2階席もバッチリ見えてたよ！ありがとう！
      また必ずおぼろっく帰ってきます！！
      今後ともNEK!をよろしくお願いします🙇🏻‍♀️
    translation: |-
      Thank you so much for OBOROCK 2026👊🏻🩵
      The percussion echoing through the hall felt amazingly good--!!
      I was so happy so many people came to watch us right from the morning!
      We could see the 2nd floor seats clearly too! Thank you!
      We will definitely come back to OBOROCK again!!
      Please continue to support NEK! going forward🙇🏻‍♀️
    image:
    - HR_j9n1bkAArv3m
    - HR_j9nkb0AANux8
    part-of:
      show:
        year: 2026
        id: oborock

