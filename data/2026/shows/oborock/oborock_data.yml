    text: |-
      ＼🌟コメント到着🌟／
      
      #NEK! さんより
      コメントをいただきました✨
      9/12(土) 角鹿の舞台(敦賀市民文化センター) 11:25～出演予定‼️
      
      2024年2月に結成されたガールズロックバンド🎸
      力強く爽快な楽曲と、等身大の言葉で綴られる歌詞が魅力✨
      ロックをベースとしながら、ネット発の印象的な歌詞を特徴とする彼女達の愛称は“スラングロックバンド"💖
      今後のロックシーンを担うNEK!の勢いに注目です！
      
      🌊おぼろっく2026
      ～TSURUGA MUSIC FESTIVAL～🌊
