- postx:
    id: 2104100074490122286
    account: coco_102
    label: Thank you
    published-date: 2026-09-27
    text: |-
      💙TOKYO CALLING 2026💙
      
      チェルシーホテルトッパーありがとうございました！
      本当に1番手か！？ってくらいみんな初めから盛り上がってくれてて最高でした！！
      NEK!のライブ気になってくれた方はぜひ今後のツアーや対バンに遊びに来てください🤝🏻🎶
      
      引き続きTOKYO CALLING楽しんでいってねー！
    translation: |-
      💙TOKYO CALLING 2026💙
      
      Thank you so much for the opening set at Chelsea Hotel!
      Everyone was hyped up right from the start so much that it was hard to believe we were the first act—it was the best!!
      If you've become interested in NEK!'s live shows, please come check out our upcoming tour and joint shows🤝🏻🎶
      
      Keep having fun at TOKYO CALLING--!
