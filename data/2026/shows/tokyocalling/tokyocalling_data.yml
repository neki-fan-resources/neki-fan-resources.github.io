- postx:
    id: 2104114589403369478
    account: natsu08_guitar
    label: Thank you
    published-date: 2026-09-27
    text: |-
      “TOKYO CALLING”
      トッパーから観に来てくださった皆さん、本当にありがとうございました！
      最高に楽しかったー！
      チェルホはフリーライブ以来ということもあってなんか感慨深い気持ちになりました！
      これを機にNEK!と出会ってくださった方！
      来年から全国ツアーもあるので是非遊びに来てください！
    translation: |-
      "TOKYO CALLING"
      To everyone who came to watch us right from the opening act, thank you so very much!
      It was the absolute most fun--!
      Since it was our first time at Chel-ho since the free live show, I felt somewhat deeply emotional!
      To those who discovered NEK! through this opportunity!
      We also have a nationwide tour starting next year, so please do come out and join us!
