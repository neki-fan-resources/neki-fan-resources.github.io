- postinstagram:
    id: DemYeAlGk3R
    account: cocoro_drum
    label: Cocoro's report
    published-date: 2026-10-17
    text: |-
      2026.10.03
      ⁡
      TRiDENT×NEK! pre. 「KYŌZON」
      お越しくださった皆様ありがとうございました！！🙏🏻💖
      ⁡
      大好きなTRiDENTと2度目となるツーマン企画！
      前回はeggmanでやらせていただき、今回は少し規模を拡大して代官山UNITでやらせていただきました！
      
      会場は広くなってもフロアのアツさは変わらず、むしろ前回よりもアツさ増し増しで、最後までノリノリで、最高のツーマンになりました！🎶
      今回もみんなで歌ってノって燃えたぎって楽しかったー！
      
      トライバーの皆さんもいつも優しくて、私たちのライブのときも声出したり拳上げたり一生懸命楽しんでくれてるのが今回もしっかり見えてとっても嬉しかったです！本当にありがとうございました！
      ⁡
      そして私事ですが、この日は私の誕生日の翌日で、TRiDENTのせりぬんさんがMC中にそのことを話してくださって、それだけでもはぁ〜〜！もう一生ついて行きます〜〜😭🫶🏻ってなっていたのに、打ち上げでもサプライズでバースデーケーキを用意してお祝いしてくださって、一生忘れない最高の思い出ができました😭💖
      ⁡
      こんな優しくて可愛くてかっこいい先輩たちと出会えて、しかも誕生日まで祝ってもらえて、、
      私は一体前世でどんな徳を積んだのでしょうか？笑
      
      こんな最高の先輩たちに出会えた私を含めNEK!は本当に幸せ者です！これからもそんな素敵な先輩たちのかっこいい背中を追いかけて、もっとアツく魅力的なバンドになれるよう頑張ります🔥
      ⁡
      
      Photo by @___sunny56__ 
      
      #neki #neki_band #girlsband #drum #femaledrummer
    translation: |-
      2026.10.03
      ⁡
      TRiDENT×NEK! pre. "KYŌZON"
      Thank you to everyone who came out!!🙏🏻💖
      ⁡
      Our 2nd two-man event with the TRiDENT we love so much!
      Last time we did it at eggman, and this time we scaled it up a bit and did it at Daikanyama UNIT!
      
      Even though the venue was bigger, the energy on the floor didn't change, or rather it was even hotter than last time, rocking out until the very end, making it the best two-man ever!🎶
      It was so fun singing, grooving, and getting all fired up together with everyone again this time!
      
      The Tri-vers (TRiDENT fans) are always so kind too, and I was so happy to clearly see you all raising your voices and throwing your fists up, enjoying our live show with all your might again this time! Thank you so much!
      ⁡
      And on a personal note, this day was the day after my birthday, and Serinun from TRiDENT mentioned it during the MC, and just with that I was like, ahhh~~! I'll follow you for the rest of my life~~😭🫶🏻, but then they even prepared a surprise birthday cake at the after-party and celebrated with me, making it the greatest memory I'll never forget😭💖
      ⁡
      To be able to meet such kind, cute, and cool seniors, and even have them celebrate my birthday...
      What kind of good deeds did I possibly do in my past life? lol
      
      Me, and the rest of NEK! who got to meet such awesome seniors, are truly lucky! We'll continue chasing after the cool backs of such wonderful seniors, and do our best to become an even hotter, more attractive band🔥
      ⁡
      
      Photo by @___sunny56__ 
      
      #neki #neki_band #girlsband #drum #femaledrummer
