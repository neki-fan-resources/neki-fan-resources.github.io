                    tour: livetour2027
                    id: tour-map
                ismultimedialeft: false
                lines:
                - line:
                  - text: The tour starts in Osaka early January, then goes north up to Sendai, before returning to the Tokyo area.
                - line:
                  - text: On February 10th, NEK! will celebrate the band anniversary with a show in Tokyo.
                - line:
                  - text: Then the tour ends south, all the way to Nagasaki for a show close to Hika's home town.
                - line:
                  - text: The tour ends with a show in Sapporo, for the first visit in Hokkaido for the band, and the final show in Tokyo.
