    published-date: 2026-07-11
    text: |-
      ◤◢◤◢  情報解禁  ◤◢◤◢
      
      2026/9/2(水)
      NEK! Major 1st EP『B!NARY』
      リリース決定🎊
      
      メジャーデビュー曲「FLiCK」を含む全5曲を収録🎧
      
      さらに初回盤A&Bには
      昨年開催した「NEK! 1ST ZEPP ONE MAN 【#拡散中 #ネキ界隈】」のライブ映像を収録🎥
      
      店舗別特典など盛りだくさんの内容です！
      ぜひチェックお願いします✔️
      
      ▼特設サイトはこちら
      https://neki10010010.ponycanyon.co.jp
      
      ▼CDのご予約はこちら
      https://lnk.to/NEKI_BINARY_CDPR
      
      #NEKI
    translation: |-
      ◤◢◤◢ Information Released ◤◢◤◢
      
      2026/9/2 (Wed)
      NEK! Major 1st EP『B!NARY』
      Release Confirmed🎊
      
      Includes a total of 5 songs, including the major debut song "FLiCK"🎧
      
      Furthermore, Limited Editions A & B include
      Live footage from last year's "NEK! 1ST ZEPP ONE MAN 【#拡散中 #ネキ界隈】"🎥
      
      It is packed with contents such as store-specific bonuses!
      Please be sure to check it out✔️
      
      ▼Click here for the special site
      https://neki10010010.ponycanyon.co.jp
      
      ▼Click here to pre-order the CD
      https://lnk.to/NEKI_BINARY_CDPR
      
