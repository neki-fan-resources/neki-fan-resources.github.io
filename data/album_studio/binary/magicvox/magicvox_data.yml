      - ol:
        - 『結論から言う、それめっちゃ**正解**』
        en:
        - "\"Long story short, that's absolutely right\""
      - ol:
        - ……って言ってたからチャッピー
        en:
        - That's what you said, Chappy
      - ol:
        - 生身の言葉　お前はどこだい
        en:
        - Where are your human words?
    - lines:
      - ol:
        - 全て知ったかエアプ素人に
        en:
        - Know-it-alls who've never been there
