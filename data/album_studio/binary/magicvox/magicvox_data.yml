    sections:
    - lines:
      - ol:
        - ギュ・ギュラ・シンギュラリティ
        en:
        - Gi-Gi-Gura Singularity
      - ol:
        - 革新的最先端
        en:
        - Cutting-edge innovation
      - ol:
        - ガ・ガラ・ガラパゴス化で
        en:
        - Ga-Ga-Galápagos syndrome
      - ol:
        - サビついた牙
        en:
        - Fangs gone rusty
      - ol:
        - 炭酸抜けたソーダ
        en:
        - Flat soda
      - ol:
        - 千早振ル風ノ夜ニ
        en:
        - On a night of raging winds
    - lines:
      - ol:
        - 錯覚するんだ
        en:
        - It's an illusion
      - ol:
        - 何が間違いか？
        en:
        - What's wrong?
      - ol:
        - 誰が悪いのか？
        en:
        - Who's to blame?
      - ol:
        - ノイズに塗れた
        en:
        - Drowned in noise
    - lines:
      - ol:
        - I wanna say that イニミニマニモ
        en:
        - I wanna say that, eeny, meeny, miny, moe
      - ol:
        - 「どうぞお好きなのいくらでも」なんてね
        en:
        - '"Take your pick, as much as you want" Yeah, right'
      - ol:
