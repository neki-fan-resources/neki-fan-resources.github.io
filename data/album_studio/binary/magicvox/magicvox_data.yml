    text: |-
      🎧CAMPAIGN🎧
      
      Major 2nd Single「MAGiC VoX」
      ストリーミングシェアキャンペーン開催決定！🎉
      
      期間内に各種音楽ストリーミングサービスで「MAGiC VoX」を再生し、
      SNSにシェアして頂いた方全員にオリジナル画像をプレゼント🎁
      
      ▼対象サービス
      Apple Music・Spotify・YouTube Music・Amazon Music・LINE MUSIC
      
      ▼対象SNS
      X・Instagramストーリーズ
      
      ▼応募期間
      7/29(水) - 8/7(金)23:59まで
      
      🔗https://neki.bitfan.id/contents/416804
      
      #NEKI #MAGiCVoX
    translation: |-
      🎧CAMPAIGN🎧
      
      Major 2nd Single "MAGiC VoX"
      Streaming Share Campaign Confirmed!🎉
      
      During the period, stream "MAGiC VoX" on any eligible music streaming service,
      and everyone who shares it on SNS will receive an original digital image as a gift🎁
      
      ▼Eligible Services
      Apple Music / Spotify / YouTube Music / Amazon Music / LINE MUSIC
      
      ▼Eligible SNS
      X / Instagram Stories
      
      ▼Campaign Period
      7/29 (Wed) - 8/7 (Fri) until 23:59
      
      🔗https://neki.bitfan.id/contents/416804
      
      #NEKI #MAGiCVoX
