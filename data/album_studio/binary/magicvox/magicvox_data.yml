        en:
        - Pushed past my limit It starts to burn
      - ol:
        - slippin' drippin' clippin' grippin'
      - ol:
        - taking my hand
    - lines:
      - ol:
        - Damn！ Damn！　ダンスビートで騒いで
        en:
        - Damn! Damn! Raise hell to the dance beat
      - ol:
        - 情報の海から解き放たれて
        en:
        - Break free from the sea of information
      - ol:
        - キラ・キラーチューン
        en:
        - Killer, killer tune
      - ol:
        - キラ・キラーチューン
        en:
        - Killer, killer tune
      - ol:
        - 晒せ
        en:
        - Bare it all
